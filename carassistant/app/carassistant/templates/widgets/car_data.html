{% from "_macros.html" import widget with context %}
{% if car_data %}
{% call widget('gauge', 'c5', _('cd.title'), none, w.size) %}
  <div class="cd-grid">
  {% for d in car_data %}<div class="cd-item"><span class="cd-l">{{ icon(d.icon, 15) }} {{ d.label }}</span><span class="cd-v">{{ d.value }}</span></div>{% endfor %}
  </div>
{% endcall %}
{% endif %}
