name: Sync labels
# Run by hand (Actions -> Sync labels -> Run workflow): makes the labels of the repository match .github/labels.yml
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crazy-max/ghaction-github-labeler@v5
        with:
          yaml-file: .github/labels.yml
          skip-delete: true
