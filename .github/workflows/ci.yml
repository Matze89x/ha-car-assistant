name: CI
on: [push, pull_request]
# a newer push of the same branch makes an older, still running check superfluous
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: carassistant/requirements.txt
      - run: pip install -r carassistant/requirements.txt pytest pytest-xdist ruff httpx pyyaml
      - run: ruff check . && ruff format --check .
      - run: pytest -q -n auto
