# Notes of a GitHub release are generated from the merged pull requests, sorted by their labels
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Fixes / Korrekturen
      labels: [bug]
    - title: Improvements / Verbesserungen
      labels: [enhancement]
    - title: Documentation / Dokumentation
      labels: [documentation]
    - title: Other / Sonstiges
      labels: ["*"]
