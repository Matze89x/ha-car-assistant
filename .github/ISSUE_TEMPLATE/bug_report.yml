name: Bug report / Fehler
description: Something does not work as it should / Etwas funktioniert nicht richtig
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A security problem is **not** an issue - please use *Security -> Report a vulnerability*.
        Danke für deine Zeit. Ein Sicherheitsproblem ist **kein** Issue - nutze bitte *Security -> Report a vulnerability*.
  - type: input
    id: version
    attributes:
      label: Version (Settings -> About / Einstellungen -> Über)
      placeholder: "0.5.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened? / Was ist passiert?
      description: What did you do, what did you expect, what did you get? / Was hast du getan, was erwartet, was bekommen?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: The Log tab of the app in Home Assistant. Remove anything private. / Der Reiter Protokoll des Add-ons. Entferne alles Private.
      render: text
  - type: dropdown
    id: where
    attributes:
      label: How do you open the app? / Wie öffnest du die App?
      options:
        - Home Assistant sidebar / Seitenleiste
        - Direct address or reverse proxy / Direkte Adresse oder Reverse-Proxy
        - Phone web app / Web-App auf dem Handy
